[project]
name = "order-intake"
version = "0.1.0"
description = "Turn orders received by email, PDF and Excel into validated orders ready for approval in the ERP."
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2.6", "openai>=2.0", "pdfplumber>=0.11", "openpyxl>=3.1", "python-dotenv>=1.0",
    "fastapi>=0.110", "uvicorn>=0.29", "jinja2>=3.1", "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "fpdf2>=2.7", "httpx>=0.27"]

[project.scripts]
order-intake = "order_intake.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
order_intake = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
